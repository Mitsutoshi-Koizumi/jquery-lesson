<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../common/css/reset.css">
  <link rel="stylesheet" href="../../common/css/base.css">
  <link rel="stylesheet" href="./css/style.css">
  <title>Document</title>
</head>
<body>
  <div class="wrapper" id="wrapper">
    <button type="button" class="btn search-btn" id="pokemon_search">ポケモンを探す</button>
  </div>
  <script src="../../common/js/jquery.js"></script>
  <script>
$(function() {

  function searchPokemon() {

    let pokemonId = Math.floor(Math.random() * 151) + 1;

    $.ajax({
      url: `https://pokeapi.co/api/v2/pokemon/${pokemonId}`,
      type: 'GET',
      dataType: 'json',

      success: function(data) {

        $.ajax({
          url: data.species.url,
          type: 'GET',
          dataType: 'json',

          success: function(speciesData) {

            let japaneseName = speciesData.names.find(function(item) {
              return item.language.name === 'ja';
            });

            let encountHtml = `
              <h2 class="name">${japaneseName.name} が現れた！</h2>
              <div>
                <img class="img" src="${data.sprites.front_default}" alt="${japaneseName.name}">
              </div>
              <div class="mt">
                <button class="btn" id="catch">捕まえる</button>
                <button class="btn" data-js="reset">逃げる</button>
              </div>
            `;

            $('#wrapper').html(encountHtml);
          }
        });
      }
    });
  }

  function catchPokemon() {

    let random = Math.random();

    if (random < 0.5) {
      getBallImage();
    } else {

      let failHtml = `
        <p class="text">逃げられてしまった...</p>
        <button class="btn mt" data-js="reset">戻る</button>
      `;

      $('#wrapper').html(failHtml);
    }
  }

  function getBallImage() {

    $.ajax({
      url: 'https://pokeapi.co/api/v2/item/4',
      type: 'GET',
      dataType: 'json',

      success: function(itemData) {

        let doneHtml = `
          <p class="name">ゲットしました</p>
          <div>
            <img class="img" src="${itemData.sprites.default}" alt="モンスターボール">
          </div>
          <button class="btn" data-js="reset">戻る</button>
        `;

        $('#wrapper').html(doneHtml);
      }
    });
  }

  function resetScreen() {

    let resetHtml = `
      <button type="button" class="btn search-btn" id="pokemon_search">ポケモンを探す</button>
    `;

    $('#wrapper').html(resetHtml);
  }

  $('#wrapper').on('click', '#pokemon_search', function() {
    searchPokemon();
  });

  $('#wrapper').on('click', '#catch', function() {
    catchPokemon();
  });

  $('#wrapper').on('click', '[data-js="reset"]', function() {
    resetScreen();
  });

});
  </script>
</body>
</html>
